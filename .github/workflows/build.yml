name: Build Release APK

# 手动触发，或者打 v* 标签时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Telegram 的 JNI 编译很吃磁盘，先腾地方（约省 30GB）
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          large-packages: true
          swap-storage: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub 的 ubuntu-latest 自带 Android SDK，直接用它的，不重复安装
      - name: Use preinstalled Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "PATH=$SDK/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"
          echo "=== SDK 根目录 ==="; ls "$SDK" || true
          echo "=== 自带 NDK ==="; ls "$SDK/ndk" 2>/dev/null || echo "  (无)"
          echo "=== 自带 CMake ==="; ls "$SDK/cmake" 2>/dev/null || echo "  (无)"
          echo "=== 自带 platforms ==="; ls "$SDK/platforms" 2>/dev/null || echo "  (无)"

      - name: Install NDK 21.4 + CMake
        run: |
          set -uo pipefail
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then echo "!! 找不到 sdkmanager: $SDKM"; ls "$ANDROID_SDK_ROOT/cmdline-tools" || true; fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          echo "=== 开始装 ndk;21.4.7075529 ==="
          yes | "$SDKM" --install "ndk;21.4.7075529" 2>&1 | tail -20 || echo "!! NDK 安装失败"
          echo "=== 开始装 cmake ==="
          for pkg in "cmake;3.10.2.4988404" "cmake;3.22.1"; do
            echo "--- $pkg"
            yes | "$SDKM" --install "$pkg" 2>&1 | tail -5 || true
            [ -d "$ANDROID_SDK_ROOT/cmake" ] && ls "$ANDROID_SDK_ROOT/cmake" && break
          done
          echo "=== 最终状态 ==="
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "  NDK 目录不存在"
          ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null || echo "  CMake 目录不存在"

      # 关键：把仓库 Secrets 里的 API 凭据写进 local.properties
      - name: Write local.properties (API credentials)
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "APP_API_ID=${{ secrets.APP_API_ID }}" >> local.properties
          echo "APP_API_HASH=${{ secrets.APP_API_HASH }}" >> local.properties
          echo "写好的内容（hash 打码）："
          sed 's/^APP_API_HASH=\(....\).*/APP_API_HASH=\1****/' local.properties

      # 可选：签名。没配 secrets 就用仓库里的 debug 签名，构建照样能过
      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Patch signing passwords
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          sed -i "s|^RELEASE_STORE_PASSWORD=.*|RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_PASSWORD=.*|RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_ALIAS=.*|RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}|" gradle.properties

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: ls -la TMessagesProj_App/build/outputs/apk/release/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jianshang-release
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
