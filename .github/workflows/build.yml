name: Build Release APK

# 手动触发，或者打 v* 标签时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Telegram 的 JNI 编译很吃磁盘，先腾地方（约省 30GB）
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          large-packages: true
          swap-storage: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 版本号从 git tag 推导：v1.0.12 → versionName=1.0.12, versionCode=10012
      # 规则 主*10000 + 次*100 + 修订，保证永远递增；gradle 还会再 ×10 + abiVersionCode
      - name: Derive version from tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            CORE="${GITHUB_REF_NAME#v}"
            MAJOR=$(echo "$CORE" | cut -d. -f1 | tr -dc '0-9')
            MINOR=$(echo "$CORE" | cut -d. -f2 | tr -dc '0-9'); MINOR=${MINOR:-0}
            PATCH=$(echo "$CORE" | cut -d. -f3 | tr -dc '0-9'); PATCH=${PATCH:-0}
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            echo "tag=$GITHUB_REF_NAME → versionName=$CORE versionCode=$CODE"
            sed -i "s|^APP_VERSION_NAME=.*|APP_VERSION_NAME=$CORE|" gradle.properties
            sed -i "s|^APP_VERSION_CODE=.*|APP_VERSION_CODE=$CODE|" gradle.properties
          else
            echo "非 tag 触发，沿用 gradle.properties 里的版本"
          fi
          grep -n '^APP_VERSION' gradle.properties

      # GitHub 的 ubuntu-latest 自带 Android SDK，直接用它的，不重复安装
      - name: Use preinstalled Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "PATH=$SDK/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"
          echo "=== SDK 根目录 ==="; ls "$SDK" || true
          echo "=== 自带 NDK ==="; ls "$SDK/ndk" 2>/dev/null || echo "  (无)"
          echo "=== 自带 CMake ==="; ls "$SDK/cmake" 2>/dev/null || echo "  (无)"
          echo "=== 自带 platforms ==="; ls "$SDK/platforms" 2>/dev/null || echo "  (无)"

      - name: Install NDK 21.4 + CMake
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKM"
          ls -la "$SDKM" || true

          # 预装 SDK 可能属于 root，先拿到写权限
          sudo chown -R "$(id -u):$(id -g)" "$SDK" 2>/dev/null || true

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

          echo "=== 安装 ndk;21.4.7075529 ==="
          if ! "$SDKM" --install "ndk;21.4.7075529" > /tmp/ndk.log 2>&1; then
            echo "!!! NDK 安装失败，日志如下："
            tail -40 /tmp/ndk.log
            exit 1
          fi
          tail -5 /tmp/ndk.log
          echo "--- $SDK/ndk:"; ls "$SDK/ndk"

          echo "=== 安装 CMake ==="
          if ! "$SDKM" --install "cmake;3.10.2.4988404" > /tmp/cmake.log 2>&1; then
            echo "!!! cmake;3.10.2.4988404 安装失败，尝试 3.22.1"
            tail -20 /tmp/cmake.log
            "$SDKM" --install "cmake;3.22.1" > /tmp/cmake2.log 2>&1 || { tail -20 /tmp/cmake2.log; exit 1; }
          fi
          echo "--- $SDK/cmake:"; ls "$SDK/cmake"

          # gradle 找的是 cmake/<version>，sdkmanager 装出来是 3.10.2.4988404，
          # 建个软链兼容 '3.10.2'
          if [ -d "$SDK/cmake/3.10.2.4988404" ] && [ ! -e "$SDK/cmake/3.10.2" ]; then
            ln -s "$SDK/cmake/3.10.2.4988404" "$SDK/cmake/3.10.2"
            echo "已建软链 cmake/3.10.2 -> 3.10.2.4988404"
          fi
          ls -la "$SDK/cmake"

          # 上游 Dockerfile 里把 build-tools 30.0.3 的 dx 复制进 35.0.0，
          # Telegram 的构建脚本会用到 dx，缺了会挂
          echo "=== 安装 build-tools 30.0.3 并复制 dx ==="
          "$SDKM" --install "build-tools;30.0.3" > /tmp/bt30.log 2>&1 || { tail -20 /tmp/bt30.log; exit 1; }
          cp -f "$SDK/build-tools/30.0.3/dx" "$SDK/build-tools/35.0.0/dx" || true
          cp -f "$SDK/build-tools/30.0.3/lib/dx.jar" "$SDK/build-tools/35.0.0/lib/dx.jar" || true
          ls -la "$SDK/build-tools/35.0.0/dx" || echo "  (dx 没复制成功，可能不需要)"

      - name: Check NDK / CMake really installed
        run: |
          set -uo pipefail
          echo "=== NDK 目录 ==="
          ls -la "$ANDROID_SDK_ROOT/ndk" || echo "  (无 ndk 目录)"
          echo "=== 每个 NDK 的 source.properties ==="
          for f in "$ANDROID_SDK_ROOT"/ndk/*/source.properties; do
            [ -f "$f" ] && { echo "--- $f"; head -5 "$f"; }
          done
          echo "=== CMake 目录 ==="
          ls -la "$ANDROID_SDK_ROOT/cmake" || echo "  (无 cmake 目录)"
          echo "=== 预装 platforms / build-tools ==="
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      # 关键：把仓库 Secrets 里的 API 凭据写进 local.properties
      - name: Write local.properties (API credentials)
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "APP_API_ID=${{ secrets.APP_API_ID }}" >> local.properties
          echo "APP_API_HASH=${{ secrets.APP_API_HASH }}" >> local.properties
          echo "写好的内容（hash 打码）："
          sed 's/^APP_API_HASH=\(....\).*/APP_API_HASH=\1****/' local.properties

      # 可选：签名。没配 secrets 就用仓库里的 debug 签名，构建照样能过
      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Patch signing passwords
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          sed -i "s|^RELEASE_STORE_PASSWORD=.*|RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_PASSWORD=.*|RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_ALIAS=.*|RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}|" gradle.properties

      - name: Build release
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "---- 最后 40 行 ----"
            tail -40 /tmp/build.log
            echo ""
            echo "======== 错误摘要（日志最后一段，截图这一段就够）========"
            echo ">>> What went wrong:"
            awk '/What went wrong/,0' /tmp/build.log | head -40
            echo ">>> 关键错误行:"
            grep -nE "error:|Error:|FAILURE:|Caused by:|Could not|not found|No version of NDK|CMake Error|Execution failed for task" /tmp/build.log | head -25
            echo "========================================================"
            exit "$STATUS"
          fi

      - name: Error summary (写在运行页面顶部)
        if: failure()
        run: |
          {
            echo "## ❌ 构建失败 · 错误摘要"
            echo ""
            echo '```'
            if [ -f /tmp/build.log ]; then
              awk '/What went wrong/,0' /tmp/build.log | head -40
              echo ""
              echo "--- 关键行 ---"
              grep -nE "error:|FAILURE:|Caused by:|Could not|not found|No version of NDK|CMake Error|Execution failed for task" /tmp/build.log | head -20
            else
              echo "(/tmp/build.log 不存在：失败发生在构建步骤之前)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show outputs
        if: always()
        run: |
          find TMessagesProj_App/build/outputs -name "*.apk" -exec ls -la {} \; 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jianshang-release
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
