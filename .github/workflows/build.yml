name: Build Release APK

# 手动触发，或者打 v* 标签时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Telegram 的 JNI 编译很吃磁盘，先腾地方（约省 30GB）
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          large-packages: true
          swap-storage: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不用第三方 action：它经常因为预装 SDK 权限、cmdline-tools 版本过旧而挂。
      # 直接下一份 commandline-tools 到用户目录，自己管。
      - name: Setup Android SDK (manual)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdkmanager 版本："
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install SDK / NDK / CMake
        run: |
          set -uo pipefail
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          echo "=== 仓库里能装到的 cmake / ndk 版本 ==="
          "$SDKM" --list 2>/dev/null | grep -E "cmake;3\.(10|22)|ndk;21\.4" | sed 's/^/  /' || true

          # 必需：装不上就直接失败，日志里看得见是哪一条
          for pkg in "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"; do
            echo "--- 安装 $pkg"
            yes | "$SDKM" --install "$pkg" || { echo "!! $pkg 安装失败"; exit 1; }
          done

          # 可选：CMake（SDK 里的包名带完整版本号，3.10.2 对应 3.10.2.4988404）
          for pkg in "cmake;3.10.2.4988404" "cmake;3.22.1"; do
            echo "--- 尝试 $pkg"
            if yes | "$SDKM" --install "$pkg"; then echo "✔ $pkg"; break; else echo "… $pkg 没有，换下一个"; fi
          done

          echo "=== 装完的目录 ==="
          ls "$ANDROID_SDK_ROOT" || true
          echo "--- ndk:"; ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "  (无)"
          echo "--- cmake:"; ls "$ANDROID_SDK_ROOT/cmake" 2>/dev/null || echo "  (无)"

      # 关键：把仓库 Secrets 里的 API 凭据写进 local.properties
      - name: Write local.properties (API credentials)
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "APP_API_ID=${{ secrets.APP_API_ID }}" >> local.properties
          echo "APP_API_HASH=${{ secrets.APP_API_HASH }}" >> local.properties
          echo "写好的内容（hash 打码）："
          sed 's/^APP_API_HASH=\(....\).*/APP_API_HASH=\1****/' local.properties

      # 可选：签名。没配 secrets 就用仓库里的 debug 签名，构建照样能过
      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
          ls -la TMessagesProj/config/release.keystore

      - name: Patch signing passwords
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          sed -i "s|^RELEASE_STORE_PASSWORD=.*|RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_PASSWORD=.*|RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}|" gradle.properties
          sed -i "s|^RELEASE_KEY_ALIAS=.*|RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}|" gradle.properties

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: ls -la TMessagesProj_App/build/outputs/apk/release/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jianshang-release
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
